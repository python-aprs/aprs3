[build-system]
requires = [
    "setuptools>=61",
    "setuptools_scm[toml]>=6.2",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "aprs3"
description = "Python module for encoding and decoding APRS data."
authors = [
    {name = "Masen Furer KF7HVM", email = "kf7hvm@0x26.net"},
    {name = "Greg Albrecht W2GMD", email = "oss@undef.net"}
]
requires-python = ">=3.11"
dependencies = [
    "attrs > 20",
    "ax253 >= 0.2.0",
    "kiss3 >= 8.1.0",
]
readme = "README.rst"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Communications :: Ham Radio",
    "Framework :: AsyncIO",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords=[
    'Ham Radio', 'APRS', 'KISS'
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/python-aprs/aprs3"


[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-timeout>=2",
    "ruff>=0.17",
    "ty==0.0.107",
]

[tool.setuptools_scm]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is the formatter's job
    "UP031",  # %-formatting is the only option for bytes
]
extend-safe-fixes = ["UP028"]

[tool.pytest.ini_options]
testpaths = ["tests", "aprs", "README.rst"]
timeout = 30
addopts = "--cov=aprs --cov-report=term-missing --doctest-modules --doctest-glob=README.rst"
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 80

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["examples"]
